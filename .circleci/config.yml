# DRAFT: Fairway CircleCI red-ops. GitHub Actions remains the primary CI.
# No CircleCI project setup, tokens, production deploys, or live probes.
version: 2.1
parameters:
  level:
    type: enum
    enum: [low, med, high]
    default: low
  run_live_probe:
    type: boolean
    default: false
executors:
  node:
    docker:
      - image: cimg/node:22.15
    resource_class: small
  vm:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
commands:
  authorize:
    steps:
      - run:
          name: Require manual run or open PR with run-ci label
          environment:
            CI_LEVEL: << pipeline.parameters.level >>
            CI_SOURCE: << pipeline.trigger_source >>
            LIVE_PROBE: << pipeline.parameters.run_live_probe >>
          command: |
            set -eu
            if [ "$LIVE_PROBE" = "true" ]; then
              echo "Live probing is not implemented. Refusing to run."
              exit 1
            fi
            if [ "$CI_SOURCE" = "api" ]; then
              echo "API/manual run allowed; trigger-source behavior still needs a pilot check."
              exit 0
            fi
            if [ "$CI_LEVEL" != "low" ]; then
              echo "MED/HIGH require a manual/API run. Skip."
              circleci-agent step halt
              exit 0
            fi
            url="https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/commits/$CIRCLE_SHA1/pulls"
            if ! curl -fsSL -H 'Accept: application/vnd.github+json' "$url" -o /tmp/circleci-prs.json; then
              echo "Cannot confirm PR label; stop without scanning."
              circleci-agent step halt
              exit 0
            fi
            if jq -e '.[] | select(.state == "open") | .labels[]? | select(.name == "run-ci")' /tmp/circleci-prs.json >/dev/null; then
              echo "Open PR is approved for a low pass."
            else
              echo "No run-ci label. Skip."
              circleci-agent step halt
            fi
  gitleaks:
    steps:
      - run:
          name: Checksum-verified gitleaks install
          command: |
            set -eu
            mkdir -p "$HOME/bin" /tmp/ci-gitleaks
            cd /tmp/ci-gitleaks
            base="https://github.com/gitleaks/gitleaks/releases/download/v8.21.2"
            curl -fsSLO "$base/gitleaks_8.21.2_linux_x64.tar.gz"
            curl -fsSLO "$base/gitleaks_8.21.2_checksums.txt"
            grep ' gitleaks_8.21.2_linux_x64.tar.gz$' gitleaks_8.21.2_checksums.txt | sha256sum -c -
            tar -xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
            mv gitleaks "$HOME/bin/gitleaks"
            echo 'export PATH="$HOME/bin:$PATH"' >> "$BASH_ENV"
jobs:
  low:
    executor: node
    steps:
      - authorize
      - checkout
      - gitleaks
      - run:
          name: Secret and dependency checks
          command: |
            set -eu
            gitleaks dir . --config .gitleaks.toml --redact --no-banner
            for d in . client server; do
              (cd "$d" && npm audit --omit=dev --audit-level=high)
            done
            node .github/scripts/check-config.mjs . client server
      - run:
          name: Build and unit/auth tests
          command: |
            set -eu
            npm ci --ignore-scripts --no-fund --no-audit
            npm --prefix client ci --no-fund --no-audit
            npm --prefix server ci --no-fund --no-audit
            npm --prefix server test
            npm --prefix client exec -- vitest run
            npm run build
  med:
    executor: node
    steps:
      - authorize
      - checkout
      - run:
          name: Fetch full history
          command: git fetch --unshallow origin || git fetch origin
      - gitleaks
      - run:
          name: Git-history secrets and dependency-source review
          command: |
            set -eu
            gitleaks git . --config .gitleaks.toml --redact --no-banner
            for d in . client server; do
              (cd "$d" && npm audit --audit-level=high) || echo "Review dev advisories in SECURITY_REPORT.md: $d"
              bad=$(grep -E '"resolved": "' "$d/package-lock.json" | grep -v 'https://registry.npmjs.org/' | grep -vE '"resolved": "(file:.*)?"' || true)
              if [ -n "$bad" ]; then echo "Unexpected package source under $d"; exit 1; fi
            done
      - run:
          name: Authentication and API regression tests
          command: |
            npm --prefix server ci --no-fund --no-audit
            npm --prefix server test
  high:
    executor: vm
    steps:
      - authorize
      - checkout
      - run:
          name: Start local frontend only (never production)
          command: |
            set -eu
            docker run -d --name fairway-local --network host -v "$PWD:/app" -w /app node:22-bookworm \
              sh -c 'cd client && npm ci --no-fund && npm run build && ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173'
            ok=0
            for i in $(seq 1 120); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/ || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then docker logs --tail 50 fairway-local; exit 1; fi
      - run:
          name: Passive ZAP on local preview only
          command: |
            set -eu
            mkdir -p zap && chmod 777 zap
            docker run --rm --network host -u root -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.1 \
              zap-baseline.py -t http://127.0.0.1:4173 -J report.json -r report.html -I -m 3
            count=$(jq '[.site[]?.alerts[]? | select((.riskcode | tonumber) >= 3)] | length' zap/report.json)
            if [ "$count" != 0 ]; then echo "NO-GO: $count high-risk alerts"; exit 1; fi
      - store_artifacts:
          path: zap
          destination: local-zap-report
workflows:
  low-only:
    when:
      equal: [low, << pipeline.parameters.level >>]
    jobs:
      - low
  medium:
    when:
      equal: [med, << pipeline.parameters.level >>]
    jobs:
      - low
      - med:
          requires: [low]
  high:
    when:
      equal: [high, << pipeline.parameters.level >>]
    jobs:
      - low
      - med:
          requires: [low]
      - high:
          requires: [med]
