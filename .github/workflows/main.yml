name: Lint, Build and Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install all dependencies
        run: |
          # The root package has an install lifecycle that installs both
          # workspaces. Skip that lifecycle here because CI installs each
          # package explicitly below; otherwise client/server install twice.
          npm install --ignore-scripts
          npm install --prefix client
          npm install --prefix server

      - name: Run lint
        run: npm run lint

      - name: Build client and server
        run: npm run build

      - name: Run server tests
        run: npm test

      - name: Run client tests
        run: npm test -- --run
        working-directory: ./client
