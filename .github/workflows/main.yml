name: Lint, Build and Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - name: Install all dependencies
        run: |
          npm install
          cd client && npm install
          cd ../server && npm install
          cd ..

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run server regression tests
        run: npm test

      - name: Run client regression tests
        run: cd client && npm test -- --run
