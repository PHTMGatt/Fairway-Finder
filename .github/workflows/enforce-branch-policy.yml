name: Enforce three-branch policy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale branches only when fully reachable from main
        uses: actions/github-script@v7
        with:
          script: |
            const keep = new Set(['main', 'chatgpt-forge', 'claude-forge']);
            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            keep.add(repository.default_branch);

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            for (const branch of branches) {
              if (keep.has(branch.name)) {
                core.info(`Keeping ${branch.name}`);
                continue;
              }

              const comparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: 'main',
                head: branch.name,
              });

              if (comparison.data.ahead_by > 0) {
                core.warning(
                  `Keeping ${branch.name}: ${comparison.data.ahead_by} commit(s) are not reachable from main.`
                );
                continue;
              }

              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch.name}` });
                core.info(`Deleted ${branch.name}; it had no commits ahead of main.`);
              } catch (error) {
                core.warning(`Could not delete ${branch.name}: ${error.message}`);
              }
            }
